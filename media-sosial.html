<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Sosial | Hari Jadi Desa Karyamukti ke-47</title>
  <link rel="icon" href="logo/favicon.ico" type="image/x-icon">
  <meta name="description" content="Daftar media sosial resmi Desa Karyamukti untuk pembaruan Hari Jadi ke-47.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Media Sosial Desa Karyamukti">
  <meta property="og:description" content="Ikuti media sosial resmi Desa Karyamukti untuk informasi Hari Jadi ke-47.">
  <meta property="og:image" content="logo/logo.png">
  <meta property="og:image:alt" content="Logo Hari Jadi Desa Karyamukti ke-47">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Media Sosial Desa Karyamukti">
  <meta name="twitter:description" content="Ikuti media sosial resmi Desa Karyamukti untuk informasi Hari Jadi ke-47.">
  <meta name="twitter:image" content="logo/logo.png">
  <style>
    :root {
      --bg: #f6efe3;
      --card: rgba(255, 250, 241, 0.94);
      --ink: #302418;
      --muted: #6e5a46;
      --line: rgba(93, 62, 34, 0.14);
      --shadow: 0 18px 42px rgba(74, 41, 18, 0.12);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fbf5ea 0%, #f6efe3 100%);
    }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px 20px;
      margin: 28px 0 24px;
      background: rgba(255, 250, 244, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(70, 39, 17, 0.08);
    }
    .logo { display: flex; justify-content: center; width: 100%; }
    .logo img { display: block; width: min(100%, 460px); height: auto; }
    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
    }
    .hero { padding: 32px; }
    .eyebrow {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(111, 90, 70, 0.12);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 { margin: 16px 0 10px; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -0.04em; }
    p { color: var(--muted); line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin: 22px 0 48px;
    }
    .card { padding: 24px; }
    .card strong { display: block; margin-bottom: 10px; font-size: 1.08rem; }
    .card span { color: var(--muted); }
    .footer {
      padding: 0 0 40px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .footer .shell {
      text-align: right;
    }
    .floating-btn {
      position: fixed;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: rgba(48, 36, 24, 0.9);
      color: #fff8ef;
      box-shadow: 0 16px 32px rgba(48, 36, 24, 0.22);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .floating-btn.share { top: 18px; right: 18px; }
    .floating-btn.back { left: 18px; bottom: 18px; }
    @media (max-width: 860px) {
      .topbar { border-radius: 24px; }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .floating-btn {
        min-width: 0;
        padding: 11px 15px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="logo" href="index.html" aria-label="Hari Jadi Desa Karyamukti ke-47">
        <img src="logo/logo.png" alt="Logo Hari Jadi Desa Karyamukti ke-47">
      </a>
    </div>

    <section class="hero">
      <div class="eyebrow">Halaman Media Sosial</div>
      <h1>Media Sosial Desa</h1>
      <p>Akun Resmi Pemerintah Desa Karyamukti.</p>
    </section>

    <section class="grid">
      <a class="card" href="https://www.facebook.com/profile.php?id=61577309605800" target="_blank" rel="noopener noreferrer">
        <strong>Facebook</strong>
        <span>Desa Karyamukti</span>
      </a>
      <a class="card" href="https://www.instagram.com/karyamukti.banjar/" target="_blank" rel="noopener noreferrer">
        <strong>Instagram</strong>
        <span>@karyamukti.banjar</span>
      </a>
      <a class="card" href="https://www.tiktok.com/@karyamukti.banjar" target="_blank" rel="noopener noreferrer">
        <strong>TikTok</strong>
        <span>@karyamukti.banjar</span>
      </a>
      <a class="card" href="https://www.youtube.com/@karyamukti.banjar" target="_blank" rel="noopener noreferrer">
        <strong>YouTube</strong>
        <span>@karyamukti.banjar</span>
      </a>
    </section>
  </div>

  <footer class="footer">
    <div class="shell">
      Karyamukti Ngajadi (7 Juni 1979 - 2026)
    </div>
  </footer>

  <button class="floating-btn share" type="button" id="shareButton">Bagikan</button>
  <button class="floating-btn back" type="button" id="backButton">Kembali</button>

  <script>
    const shareButton = document.getElementById("shareButton");
    const backButton = document.getElementById("backButton");

    shareButton.addEventListener("click", async function () {
      const shareData = {
        title: document.title,
        text: "Hari Jadi Desa Karyamukti ke-47",
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
          return;
        }

        await navigator.clipboard.writeText(window.location.href);
        alert("Tautan halaman sudah disalin.");
      } catch (error) {
        if (error && error.name !== "AbortError") {
          alert("Tautan belum bisa dibagikan dari browser ini.");
        }
      }
    });

    backButton.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
